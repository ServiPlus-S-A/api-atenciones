name: CI (PR to develop)

on:
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: serviplus-atenciones-backend

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff (lint)
        run: |
          export PYTHONPATH=backend
          ruff check backend/atenciones backend/config backend/tests

      - name: Mypy (type check)
        run: |
          mypy backend/atenciones backend/config backend/tests --explicit-package-bases

      - name: Pytest (coverage >= 80%)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: |
          cd backend
          PYTHONPATH=. pytest --cov=atenciones --cov-report=term-missing --cov-fail-under=80

  docker:
    name: Docker build (verificación)
    runs-on: ubuntu-latest
    needs: backend-quality

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build sin push — confirma que el Dockerfile es válido
      # El push a Docker Hub ocurre en el pipeline de main
      - name: Docker build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI - backend-atenciones

# Solo se ejecuta en Pull Request hacia develop.
# Push directo a develop está bloqueado por protección de rama.
on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  IMAGE_NAME: serviplus-atenciones-backend

jobs:
  quality:
    name: Lint y tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check atenciones tests config

      - name: Tipos (mypy)
        working-directory: .
        run: mypy

  test:
    name: Tests - pytest (cobertura >= 80 %)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: atenciones_test
          POSTGRES_USER: atenciones_ci
          POSTGRES_PASSWORD: atenciones_ci_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      SECRET_KEY: ci-secret-key-no-usar-en-produccion
      DATABASE_URL: postgresql://atenciones_ci:atenciones_ci_pass@localhost:5432/atenciones_test
      CONN_MAX_AGE: '0'
      SOLICITUDES_URL: http://stub-solicitudes/api
      PARAMETRIZACION_URL: http://stub-parametrizacion/api

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Migraciones
        run: python manage.py migrate --no-input

      - name: Tests (pytest)
        run: pytest --no-cov

      - name: Cobertura (>= 80 %)
        run: |
          pytest \
            --cov=atenciones \
            --cov=config \
            --cov-report=term-missing \
            --cov-fail-under=80

  docker:
    name: Docker build (verificación)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
python_files = test_*.py
addopts = --cov=atenciones --cov-report=term-missing --strict-markers --reuse-db
markers =
    unit: pruebas unitarias sin BD
    integration: pruebas de integración con BD
    slow: pruebas lentas

[run]
omit =
    */config/*
    */swagger/*
    */migrations/*
    */models/*
    */entities/*
    */orm/*
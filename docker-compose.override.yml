# Docker Compose — dev overrides: volumes hot-reload, DEBUG=true
services:
  backend:
    entrypoint: ["sh", "-c", "python manage.py seed_estados && python manage.py runserver 0.0.0.0:8000"]
    environment:
      DEBUG: "true"
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app

  celery-worker:
    volumes:
      - ./backend:/app

  celery-beat:
    volumes:
      - ./backend:/app


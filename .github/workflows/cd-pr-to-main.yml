name: CD – backend-atenciones

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/serviplus-atenciones-backend

jobs:
  build-and-push:
    name: Build y push → Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login a Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pull-images:
    name: Pull de imágenes en EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Copiar docker-compose.prod.yml
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /home/ec2-user/serviplus/atenciones/

      - name: Pull imágenes
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/serviplus/atenciones

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker compose -f docker-compose.prod.yml pull backend celery-worker

  start-services:
    name: Levantar servicios en EC2
    runs-on: ubuntu-latest
    needs: pull-images
    env:
      HEALTH_BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Levantar servicios
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/serviplus/atenciones

            DATABASE_URL_VAL=$(grep '^DATABASE_URL=' .env | cut -d'=' -f2-)

            docker compose -f docker-compose.prod.yml run --rm \
              --entrypoint "" \
              -e DATABASE_URL="$DATABASE_URL_VAL" \
              backend python manage.py migrate --no-input

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            sleep 20

            echo "Esperando que el servicio esté listo..."

            for i in $(seq 1 12); do
              STATUS=$(curl --max-time 5 -s -o /dev/null -w "%{http_code}" \
                -H "X-Forwarded-Proto: https" \
                "${{ env.HEALTH_BASE_URL }}/health/" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Servicio saludable tras $i intento(s)"
                break
              fi
              echo "Intento $i/12 — HTTP $STATUS — esperando 10s..."
              sleep 10
              if [ "$i" = "12" ]; then
                echo "ERROR: el servicio no respondió en 2 minutos"
                exit 1
              fi
            done

            docker image prune -f

            echo "Despliegue completado: ${{ github.sha }}"

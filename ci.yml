name: CI – backend-atenciones

# ─────────────────────────────────────────────────────────────────
# Solo se ejecuta en Pull Request hacia develop.
# Push directo a develop está bloqueado por protección de rama.
# ─────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [develop]

env:
  PYTHON_VERSION: '3.12'
  IMAGE_NAME: serviplus-atenciones-backend

# ═══════════════════════════════════════════════════════════════
# JOB 1 ── Calidad de código: ruff + mypy
# ═══════════════════════════════════════════════════════════════
jobs:
  quality:
    name: Lint y tipos
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ── Paso 1: Ruff ─────────────────────────────────────────
      - name: Lint (Ruff)
        run: ruff check atenciones tests config

      # ── Paso 2: mypy ─────────────────────────────────────────
      - name: Tipos (mypy)
        run: mypy atenciones

# ═══════════════════════════════════════════════════════════════
# JOB 2 ── Tests + cobertura ≥ 80 %
#   Requiere: quality (no corre si lint o tipos fallan)
# ═══════════════════════════════════════════════════════════════
  test:
    name: Tests – pytest (cobertura ≥ 80 %)
    runs-on: ubuntu-latest
    needs: quality

    defaults:
      run:
        working-directory: backend

    # ── Servicios auxiliares para pytest-django ───────────────
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       atenciones_test
          POSTGRES_USER:     atenciones_ci
          POSTGRES_PASSWORD: atenciones_ci_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout  5s
          --health-retries  5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout  5s
          --health-retries  5
        ports:
          - 6379:6379

    # ── Variables de entorno para Django en CI ────────────────
    env:
      DJANGO_SETTINGS_MODULE:    config.settings.development
      SECRET_KEY:                ci-secret-key-no-usar-en-produccion
      # Puerto 5432 directo (sin PgBouncer) — correcto para migraciones y tests
      DATABASE_URL:              postgresql://atenciones_ci:atenciones_ci_pass@localhost:5432/atenciones_test
      REDIS_CACHE_URL:           redis://localhost:6379/1
      REDIS_BROKER_URL:          redis://localhost:6379/0
      CONN_MAX_AGE:              '0'
      SOLICITUDES_BASE_URL:      http://stub-solicitudes
      PARAMETRIZACION_BASE_URL:  http://stub-parametrizacion

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ── Paso 3: Migraciones sobre la DB de CI ────────────────
      - name: Migraciones
        run: python manage.py migrate --no-input

      - name: Debug env
        run: |
              echo "DATABASE_URL=[$DATABASE_URL]"
              env | grep DATABASE

      # ── Paso 4: pytest ───────────────────────────────────────
      - name: Tests (pytest)
        run: pytest

      # ── Paso 5: Cobertura ≥ 80 % ─────────────────────────────
      - name: Cobertura (≥ 80 %)
        run: |
          pytest \
            --cov=atenciones \
            --cov-report=term-missing \
            --cov-fail-under=80
        # --cov=config no se incluye porque no hay código en esa capa

# ═══════════════════════════════════════════════════════════════
# JOB 3 ── Docker build (solo verifica que la imagen construye)
#   Sin push — Docker Hub se alimenta desde el flujo a main
#   Requiere: test (no corre si los tests fallan o cobertura < 80 %)
# ═══════════════════════════════════════════════════════════════
  docker:
    name: Docker build (verificación)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build sin push — confirma que el Dockerfile es válido
      # El push a Docker Hub ocurre en el pipeline de main
      - name: Docker build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max